
name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch real contribution data
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: M-Piyush-21

      - name: Render animated contribution graph
        run: python scripts/generate_streak_svg.py M-Piyush-21 contrib-heatmap.svg

      - name: Render animated stats card
        run: python scripts/render_stats_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg"
