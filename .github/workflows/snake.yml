
name: Update contribution animation

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch my contribution data
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: M-Piyush-21

      - name: Generate animated heatmap
        run: python scripts/generate_streak_svg.py M-Piyush-21 contrib-heatmap.svg

      - name: Commit generated heatmap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update animated contribution heatmap"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
